name: Manter o site ligado

on:
  schedule:
    # A cada 10 minutos (o Render gratuito desliga após ~15 min sem visitas)
    - cron: "*/10 * * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar o site
        run: |
          # O Render pode levar ~1 min para "acordar", por isso o tempo limite maior
          curl --silent --show-error --fail \
               --max-time 120 --retry 3 --retry-delay 10 \
               --output /dev/null --write-out "Status: %{http_code} em %{time_total}s\n" \
               https://xadrez-nzgo.onrender.com/
