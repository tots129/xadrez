<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xadrez</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>♞ Xadrez</h1>

    <!-- MENU -->
    <section id="menu">
      <div class="modos">
        <button data-modo="bot">🤖 Contra o bot</button>
        <button data-modo="local">👥 Local (2 pessoas)</button>
        <button data-modo="online">🌐 Online</button>
      </div>

      <div id="opcoes-bot" class="opcoes" hidden>
        <label>Você joga de
          <select id="cor-bot">
            <option value="w">Brancas</option>
            <option value="b">Pretas</option>
          </select>
        </label>
        <label>Nível do bot
          <select id="nivel-bot">
            <option value="1">Fácil (jogadas aleatórias)</option>
            <option value="2" selected>Médio</option>
            <option value="3">Difícil</option>
          </select>
        </label>
        <button id="btn-iniciar-bot" class="destaque">Começar</button>
      </div>

      <div id="opcoes-online" class="opcoes" hidden>
        <button id="btn-criar" class="destaque">Criar sala</button>
        <span>ou</span>
        <input id="codigo" placeholder="Código da sala" maxlength="4" autocomplete="off" />
        <button id="btn-entrar">Entrar</button>
      </div>
    </section>

    <!-- JOGO -->
    <section id="jogo" hidden>
      <div id="status"></div>
      <div id="info"></div>
      <div id="tabuleiro"></div>
      <div class="controles">
        <button id="btn-novo">Novo jogo</button>
        <button id="btn-desfazer">Desfazer</button>
        <button id="btn-girar">Girar tabuleiro</button>
        <button id="btn-menu">Menu</button>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
